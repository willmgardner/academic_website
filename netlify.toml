[build]
  publish = "."

[[redirects]]
  from = "/project/gbd/*"
  to = "/research.html#gbd"
  status = 301

[[redirects]]
  from = "/project/nhlbi/*"
  to = "/research.html#nhlbi"
  status = 301

[[redirects]]
  from = "/project/*"
  to = "/research.html"
  status = 301

[[redirects]]
  from = "/publication/*"
  to = "/publications.html"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/writing.html"
  status = 301

[[redirects]]
  from = "/talk/*"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/authors/*"
  to = "/index.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
